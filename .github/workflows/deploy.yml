name: Continuous Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NITRO_PRESET: cloudflare-module
  VITE_SUPABASE_URL: https://worzpzbutngugwzhlvtj.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_zww1QFK_jynAmjvcc0-m_g_A4I1aC8V

permissions:
  contents: read

jobs:
  verify-quality-and-security:
    name: Verify Quality & Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: TypeScript Check
        run: npm run typecheck

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build application bundle for artifact verification
        run: npm run build

      - name: Run verification test suite
        run: npm test

      - name: Verify no leaked production service role keys
        run: sh scripts/scan-secrets.sh

  deploy-staging:
    name: Deploy to Cloudflare Staging
    needs: verify-quality-and-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application bundle
        run: npm run build

      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is required for deployment on main branch. Failing deployment."
            exit 1
          fi

      - name: Reject a superseded release revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::error::A newer main revision exists. This release will not deploy."
            exit 1
          fi

      - name: Require an explicit isolated staging configuration
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('.output/server/wrangler.json')); if (!c.env?.staging || c.env.staging.vars?.SUPABASE_URL !== 'https://mfpnfxpgkfuqtedbcxvp.supabase.co' || c.env.staging.vars?.LEAD_NOTIFICATIONS_ENABLED !== 'false') { console.error('Isolated staging deployment is not configured; refusing implicit environment inheritance. Use the documented verified local release procedure.'); process.exit(1); }"

      - name: Deploy to Cloudflare Staging
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .output/server
          command: deploy --env staging

  deploy-production:
    name: Deploy to Cloudflare Production
    needs: [verify-quality-and-security, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application bundle
        run: npm run build

      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is required for production deployment on main branch. Failing deployment."
            exit 1
          fi

      - name: Reject a superseded release revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::error::A newer main revision exists. This release will not deploy."
            exit 1
          fi

      - name: Deploy prebuilt Nitro worker to Cloudflare Production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .output/server
          command: deploy
